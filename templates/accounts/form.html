{% extends "base.html" %}
{% block conteudo %}

<form method="post" class="card card-body shadow-sm" novalidate>
  {% csrf_token %}
  {% include "partials/form_campos.html" %}
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Salvar</button>
    <a class="btn btn-link" href="{{ voltar }}">Cancelar</a>
  </div>
</form>
{% endblock %}
