{% extends "base.html" %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Usuários da organização</h1>
  <a class="btn btn-primary" href="{% url 'usuario_novo' %}">Novo usuário</a>
</div>
<table class="table table-striped bg-white shadow-sm">
  <thead><tr><th>Usuário</th><th>Nome</th><th>Papel</th><th>Ativo</th><th></th></tr></thead>
  <tbody>
  {% for u in usuarios %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.get_full_name }}</td>
      <td>{{ u.get_papel_display }}</td>
      <td>{{ u.is_active|yesno:"Sim,Não" }}</td>
      <td class="text-end"><a class="btn btn-sm btn-outline-secondary" href="{% url 'usuario_editar' u.pk %}">Editar</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="5" class="text-muted">Nenhum usuário.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
