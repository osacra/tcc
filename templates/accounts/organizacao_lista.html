{% extends "base.html" %}
{% block conteudo %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Organizações</h1>
  <a class="btn btn-primary" href="{% url 'organizacao_nova' %}">Nova organização</a>
</div>
<table class="table table-striped bg-white shadow-sm">
  <thead><tr><th>Nome</th><th>Ativa</th><th>Criada em</th><th></th></tr></thead>
  <tbody>
  {% for org in organizacoes %}
    <tr>
      <td>{{ org.nome }}</td>
      <td>{{ org.ativa|yesno:"Sim,Não" }}</td>
      <td>{{ org.criada_em|date:"d/m/Y H:i" }}</td>
      <td class="text-end"><a class="btn btn-sm btn-outline-secondary" href="{% url 'organizacao_editar' org.pk %}">Editar</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="4" class="text-muted">Nenhuma organização cadastrada.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
