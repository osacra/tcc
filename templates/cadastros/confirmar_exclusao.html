{% extends "base.html" %}
{% block conteudo %}
<h1 class="h4 mb-3">Excluir registro</h1>
<form method="post" class="card card-body shadow-sm">
  {% csrf_token %}
  <p>Confirma a exclusão de <strong>{{ object }}</strong>?</p>
  <div>
    <button class="btn btn-danger" type="submit">Excluir</button>
    <a class="btn btn-link" href="{{ voltar }}">Cancelar</a>
  </div>
</form>
{% endblock %}
