name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_ENV: development
  DJANGO_SECRET_KEY: ci-only-secret-key
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: liberacao
  POSTGRES_USER: liberacao
  POSTGRES_PASSWORD: liberacao
  POSTGRES_HOST: 127.0.0.1
  POSTGRES_PORT: "5432"

jobs:
  test:
    name: Python ${{ matrix.python-version }} / PostgreSQL 16
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: liberacao
          POSTGRES_USER: liberacao
          POSTGRES_PASSWORD: liberacao
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U liberacao -d liberacao"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Verificar migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migrations no PostgreSQL
        run: python manage.py migrate --noinput

      - name: Django system check
        run: python manage.py check

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Testes com cobertura
        run: coverage run -m pytest -q

      - name: Relatório de cobertura
        run: coverage report --show-missing --fail-under=90 && coverage xml -o coverage.xml

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
